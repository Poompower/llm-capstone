services:
  - type: web
    name: cateatfish-ai
    runtime: python
    buildCommand: pip install -r requirements.txt && python seed_db.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://llm.nat-d.uk/v1
      - key: LLM_MODEL
        value: gemma-4-E4B-it
      - key: PYTHON_VERSION
        value: 3.11.10

